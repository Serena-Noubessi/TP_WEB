<section #console class="mix-page" [class.has-visuals]="visuals.enabled()" [class.is-fullscreen]="visuals.fullscreen()">
  <div class="mix-hero">
    <div>
      <p class="mix-eyebrow">TABLE DE MIXAGE</p>
      <h1>Mixage DJ</h1>
      <p class="mix-intro">Chargez vos morceaux sur les platines, calez les tempos et mixez.</p>
    </div>
    <button
      type="button"
      class="autoplay"
      role="switch"
      [attr.aria-checked]="engine.autoPlay()"
      [class.is-on]="engine.autoPlay()"
      (click)="engine.setAutoPlay(!engine.autoPlay())"
      title="Quand c'est activé, un morceau démarre tout seul dès qu'il est chargé sur une platine"
    >
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      Lecture automatique au chargement
    </button>
    <dl class="shortcuts" aria-label="Raccourcis clavier">
      <div><dt>Q / P</dt><dd>Lecture A / B</dd></div>
      <div><dt>W / O</dt><dd>Cue A / B</dd></div>
      <div><dt>S / L</dt><dd>Sync A / B</dd></div>
    </dl>
  </div>

  <app-mix-project-bar class="project-bar" />

  <app-dj-visualizer #visuals [fullscreenTarget]="console" />

  <div class="console">
    <div
      class="drop-zone"
      [class.is-target]="dropTarget() === 'A'"
      (dragover)="dragOver('A', $event)"
      (dragleave)="dragLeave('A')"
      (drop)="drop('A', $event)"
    >
      <app-dj-deck deckId="A" color="#007fff" />
    </div>

    <app-dj-mixer class="console-mixer" />

    <div
      class="drop-zone"
      [class.is-target]="dropTarget() === 'B'"
      (dragover)="dragOver('B', $event)"
      (dragleave)="dragLeave('B')"
      (drop)="drop('B', $event)"
    >
      <app-dj-deck deckId="B" color="#a99bef" />
    </div>
  </div>

  <app-dj-library />
</section>
